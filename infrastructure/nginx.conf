worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolves the `api` service name to the IP of every
    # running replica. Using a variable (instead of a static `upstream {}` block)
    # forces Nginx to re-resolve every `valid` interval, so `docker compose up
    # --scale api=N` is picked up without restarting Nginx -- a static upstream
    # block would only resolve once and pin every request to whichever single
    # replica existed at Nginx startup, which would silently defeat the whole
    # point of horizontal scaling for the Locust comparison.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 220m;

    server {
        listen 80;

        location / {
            set $upstream http://api:8000;
            proxy_pass $upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
